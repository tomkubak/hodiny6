; Digitronové hodiny Z566M – ESP32-C3 SuperMini
; Ověřeno: Arduino core 2.0.17 (platform espressif32 6.x), ESPAsyncWebServer 3.12,
; AsyncTCP 3.5, ElegantOTA 3.1.7 i 4.0.0, RTClib 2.1.4

[env:esp32c3_supermini]
platform = espressif32 @ ^6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; 2 × 1,25 MB aplikace (nutné pro OTA), firmware zabírá cca 70 %
board_build.partitions = default.csv

build_flags =
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_compat_mode = strict
lib_ldf_mode = chain

lib_deps =
    esp32async/AsyncTCP @ ^3.5.0
    esp32async/ESPAsyncWebServer @ ^3.7.3
    ayushsharma82/ElegantOTA @ ^3.1.7
    adafruit/RTClib @ ^2.1.4

; Nahrání přes WiFi přímo z PlatformIO:  pio run -e ota -t upload
; (nebo v VS Code vyber prostředí "ota" a dej Upload)
[env:ota]
extends = env:esp32c3_supermini
upload_protocol = espota
upload_port = hodiny.local
; když nastavíš heslo OTA ve webu, odkomentuj:
; upload_flags = --auth=TVOJE_HESLO
